# CI: runs on every pull request and on pushes to main and develop.
#
# - app:      clean install, then lint, typecheck, unit tests and build for every
#             workspace app (apps/web, apps/api).
# - database: starts a throwaway local Supabase (database, auth, PostgREST and the
#             API gateway only) in Docker, applies every migration in supabase/migrations/
#             plus seed.sql, runs the pgTAP security tests in supabase/tests/, then the
#             API's RLS integration tests against it. Never touches the real project.
#
# Both jobs must pass before a PR is merged.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (lint, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    name: Database (migrations + security tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase (database, auth, PostgREST, gateway)
        run: >-
          npx supabase start
          -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Apply all migrations and seed.sql
        run: npx supabase db reset --yes
      - name: Run database tests
        run: npx supabase test db
      - name: Run API integration tests (RLS equivalence)
        run: |
          echo "status provides: $(npx supabase status -o env | cut -d= -f1 | tr '\n' ' ')"
          eval "$(npx supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|JWT_SECRET|DB_URL)=')"
          SUPABASE_TEST_URL="$API_URL" \
          SUPABASE_TEST_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" \
          SUPABASE_TEST_JWT_SECRET="$JWT_SECRET" \
          SUPABASE_TEST_DB_URL="$DB_URL" \
          npm run test:integration -w @breadcrumb/api
