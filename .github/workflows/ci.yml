# CI: runs on every pull request and on pushes to main.
#
# - app:      clean install, lint, typecheck and production build of the Vite app.
# - database: starts a throwaway local Supabase database in Docker, applies every
#             migration in supabase/migrations/ plus seed.sql, then runs the pgTAP
#             security tests in supabase/tests/. Never touches the real project.
#
# Both jobs must pass before a PR is merged.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (lint, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  database:
    name: Database (migrations + security tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase database
        run: npx supabase db start
      - name: Apply all migrations and seed.sql
        run: npx supabase db reset --yes
      - name: Run database tests
        run: npx supabase test db
